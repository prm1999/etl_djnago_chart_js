{% extends 'base.html' %}
{% load static %}

{% block base %}
<div class="row">
    <!-- Filters Card -->
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-filter me-2"></i>Drill Down Analysis
            </div>
            <div class="card-body">
                <form action="{% url 'lr_visual:drill_down' %}" method="POST" class="row g-3 align-items-end">
                    {% csrf_token %}
                    
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Select Months</label>
                        <select class="form-select" name="month_dropdown" multiple size="3">
                            {% for mth in monthList %}
                                <option value="{{mth}}">{{mth|upper}}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Select Zone</label>
                        <select class="form-select" name="zone_dropdown">
                            {% for zne in zoneList %}
                                <option value="{{zne}}">{{zne|upper}}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Chart Type</label>
                        <select class="form-select" name="chart_dropdown">
                            <option value="column">Column</option>
                            <option value="spline">Spline</option>
                            <option value="line">Line</option>
                            <option value="pie">Pie</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <button class="btn btn-success w-100 py-2" type="submit">
                            <i class="fas fa-search me-2"></i>Analyze Drill Down
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Chart Card -->
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-chart-line me-2"></i>Drill Down Visualization</span>
                <small class="text-muted">Click on bars to see deeper details</small>
            </div>
            <div class="card-body">
                <figure class="highcharts-figure">
                    <div id="container" style="width: 100%; height: 500px;"></div>
                </figure>
            </div>
        </div>
    </div>
</div>

<!-- Highcharts scripts -->
<script src="{% static 'highcharts/highcharts.min.js' %}"></script>
<script src="{% static 'highcharts/modules/data.min.js' %}"></script>
<script src="{% static 'highcharts/modules/drilldown.min.js' %}"></script>
<script src="{% static 'highcharts/modules/exporting.min.js' %}"></script>
<script src="{% static 'highcharts/modules/export-data.min.js' %}"></script>
<script src="{% static 'highcharts/modules/accessibility.min.js' %}"></script>

{% if seriesData %}
<script>
    // Logic preserved exactly
    if (typeof Highcharts === 'undefined') {
        document.getElementById('container').innerHTML =
            '<div style="color:red;padding:1em;">Highcharts library failed to load.</div>';
    } else {
        Highcharts.chart('container', {
            chart: {
                type: '{{selectedchart}}'
            },
            title: {
                text: 'ZONE DISTRIBUTION WITH BUCKET DISPLAY'
            },
            subtitle: {
                text: 'Click a zone to see bucket breakdown'
            },
            xAxis: {
                type: "category",
                crosshair: true
            },
            yAxis: {
                title: {
                    text: 'Percentage (%)'
                }
            },
            accessibility: {
                announceNewData: {
                    enabled: true
                },
                point: {
                    valueSuffix: '%'
                }
            },
            plotOptions: {
                series: {
                    dataLabels: {
                        enabled: true,
                        format: '{point.name}: {point.y:.2f}%'
                    }
                }
            },
            tooltip: {
                headerFormat: '<span style="font-size:11px">{series.name}</span><br>',
                pointFormat: '<span style="color:{point.color}">{point.name}</span>: <b>{point.y:.2f}%</b> of total<br/>'
            },
            series: [
                {
                    name: "Zone Distribution",
                    colorByPoint: true,
                    data: {{seriesData|safe}}
                }
            ],
            drilldown: {
                series: {{dataList|safe}}
            }
        });
    }
</script>
{% endif %}
{% endblock %}
