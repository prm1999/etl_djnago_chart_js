{% extends 'base.html'%}

{% load static  %}

 {% block base %}
<div class="container mt-4">
  {{MSG}}
    <div class="container">
      <form  action="{% url 'lr_visual:drill_down'%}" method="POST">
        {% csrf_token %}

        <select class="" name="month_dropdown" multiple>
        {% for mth in monthList%}

            <option value="{{mth}}">{{mth|upper}}</option>
        {% endfor %}
        </select>
        <select class="" name="zone_dropdown" >
        {% for zne in zoneList%}

            <option value="{{zne}}">{{zne|upper}}</option>
        {% endfor %}
        </select>

        <select class="" name="chart_dropdown" >

            <option value="column">COLUMN</option>
            <option value="spline">SPLINE</option>
             <option value="line">LINE</option>
            <option value="pie">PIE</option>


        </select>
        <br>

        <button class="btn btn-success " type="submit" style="width :100px">
            search
        </button>

        </form>
            </div>
    <h3>USER SELECTED {{userSelectedmonth}} MONTH </h3>
    <br>
    <br>
    <script src="{% static 'highcharts/highcharts.min.js' %}"></script>
    <script src="{% static 'highcharts/modules/data.min.js' %}"></script>
    <script src="{% static 'highcharts/modules/drilldown.min.js' %}"></script>
    <script src="{% static 'highcharts/modules/exporting.min.js' %}"></script>
    <script src="{% static 'highcharts/modules/export-data.min.js' %}"></script>
    <script src="{% static 'highcharts/modules/accessibility.min.js' %}"></script>

    <figure class="highcharts-figure">
        <div id="container"></div>
        <p class="highcharts-description">
        </p>
    </figure>

    {% if seriesData %}
    <script>
        if (typeof Highcharts === 'undefined') {
            document.getElementById('container').innerHTML =
                '<div style="color:red;padding:1em;">Highcharts library failed to load. Check your network/proxy access to code.highcharts.com.</div>';
        } else {
            Highcharts.chart('container', {
                chart: {
                    type: '{{selectedchart}}'
                },
                title: {
                    text: 'ZONE DISTRIBUTION WITH BUCKET DISPLAY'
                },
                subtitle: {
                    text: 'Click a zone to see bucket breakdown'
                },
                xAxis: {
                    type: "category",
                    crosshair: true
                },
                yAxis: {
                    title: {
                        text: 'Percentage (%)'
                    }
                },
                accessibility: {
                    announceNewData: {
                        enabled: true
                    },
                    point: {
                        valueSuffix: '%'
                    }
                },
                plotOptions: {
                    series: {
                        dataLabels: {
                            enabled: true,
                            format: '{point.name}: {point.y:.2f}%'
                        }
                    }
                },
                tooltip: {
                    headerFormat: '<span style="font-size:11px">{series.name}</span><br>',
                    pointFormat: '<span style="color:{point.color}">{point.name}</span>: <b>{point.y:.2f}%</b> of total<br/>'
                },
                series: [
                    {
                        name: "Zone Distribution",
                        colorByPoint: true,
                        data: {{seriesData|safe}}
                    }
                ],
                drilldown: {
                    series: {{dataList|safe}}
                }
            });
        }
    </script>
    {% endif %}



</div>
{% endblock  %}
